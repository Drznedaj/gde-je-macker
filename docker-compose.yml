# Local development database. Not for production.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: macker
      POSTGRES_PASSWORD: macker
      POSTGRES_DB: macker
    ports:
      - "127.0.0.1:5432:5432"   # local only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macker -d macker"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
