openapi: 3.0.3
info:
  title: Gde je Macker API
  version: 0.1.0
  description: >
    v0 contract for the MVP (lost/found posts, map+list, alerts, management by secret token).
    No accounts. Sightings are planned but intentionally absent.
servers:
  - url: https://api.example.invalid   # replace with the real domain
paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        "200": { description: OK }
  /photos:
    post:
      summary: Upload one photo (re-encoded to WebP, EXIF stripped). Returns a photo id to attach to a post.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoRef" }
        "413": { description: Too large }
        "415": { description: Unsupported type }
  /posts:
    get:
      summary: List active posts in a bounding box (moderation pending or approved; held and rejected are hidden)
      parameters:
        - { name: bbox, in: query, required: true, description: "west,south,east,north", schema: { type: string } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/Kind" } }
        - { name: species, in: query, schema: { $ref: "#/components/schemas/Species" } }
        - { name: since, in: query, description: "ISO 8601; only posts created after this", schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Post" }
    post:
      summary: Create a post. Response includes the manage token once; only its hash is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostCreated" }
        "422": { description: Validation error (for example point outside Serbia) }
        "429": { description: Rate limited }
  /posts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get one post
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "404": { description: Not found or removed }
    patch:
      summary: Edit a post (requires manage token)
      security: [ { manageToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostUpdate" }
      responses:
        "200": { description: OK }
        "401": { description: Missing or wrong token }
    delete:
      summary: Delete a post (requires manage token)
      security: [ { manageToken: [] } ]
      responses:
        "204": { description: Deleted }
        "401": { description: Missing or wrong token }
  /posts/{id}/renew:
    post:
      summary: Extend expiry (requires manage token)
      security: [ { manageToken: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
  /posts/{id}/reunite:
    post:
      summary: Mark reunited; optionally record found distance (distance and class only, never the point)
      security: [ { manageToken: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                found_distance_m: { type: integer, minimum: 0 }
      responses:
        "200": { description: OK }
  /posts/{id}/widen:
    post:
      summary: Widen the alert radius manually (requires manage token)
      security: [ { manageToken: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
  /posts/{id}/report:
    post:
      summary: Report a post
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "202": { description: Accepted }
  /alerts/subscriptions:
    post:
      summary: Register or update a device with coarse geohash cells. The exact home point never leaves the device.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Subscription" }
      responses:
        "204": { description: OK }
    delete:
      summary: Remove a device subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        "204": { description: Removed }
components:
  securitySchemes:
    manageToken:
      type: apiKey
      in: header
      name: X-Manage-Token
  schemas:
    Kind: { type: string, enum: [lost, found] }
    Species: { type: string, enum: [dog, cat] }
    Sex: { type: string, enum: [male, female, unknown] }
    TriState: { type: string, enum: [yes, no, unknown] }
    Point:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
    PhotoRef:
      type: object
      required: [id, url]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        width: { type: integer }
        height: { type: integer }
    PostCreate:
      type: object
      required: [kind, species, last_seen_point, last_seen_at, contact]
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        species: { $ref: "#/components/schemas/Species" }
        sex: { $ref: "#/components/schemas/Sex" }
        neutered: { $ref: "#/components/schemas/TriState" }
        goes_outside: { $ref: "#/components/schemas/TriState" }
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 2000 }
        last_seen_point: { $ref: "#/components/schemas/Point" }
        last_seen_at: { type: string, format: date-time }
        contact: { type: string, maxLength: 200 }
        photo_ids: { type: array, maxItems: 3, items: { type: string, format: uuid } }
    PostUpdate:
      type: object
      properties:
        description: { type: string, maxLength: 2000 }
        contact: { type: string, maxLength: 200 }
        photo_ids: { type: array, maxItems: 3, items: { type: string, format: uuid } }
    Post:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/Kind" }
        species: { $ref: "#/components/schemas/Species" }
        sex: { $ref: "#/components/schemas/Sex" }
        neutered: { $ref: "#/components/schemas/TriState" }
        goes_outside: { $ref: "#/components/schemas/TriState" }
        name: { type: string }
        description: { type: string }
        last_seen_point:
          allOf: [ { $ref: "#/components/schemas/Point" } ]
          description: "Rounded to 3 decimals (about 100 m) in public responses. The exact point is never served (ADR 0002)."
        last_seen_at: { type: string, format: date-time }
        contact: { type: string }
        radius_m: { type: integer }
        status: { type: string, enum: [active, reunited, expired] }
        photos: { type: array, items: { $ref: "#/components/schemas/PhotoRef" } }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    PostCreated:
      allOf:
        - $ref: "#/components/schemas/Post"
        - type: object
          properties:
            manage_token: { type: string, description: "Shown once. Build the secret management link from it." }
    Subscription:
      type: object
      required: [transport, endpoint, cells]
      properties:
        transport: { type: string, enum: [fcm, webpush] }
        endpoint: { type: string }
        p256dh: { type: string }
        auth: { type: string }
        cells:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, description: "geohash, precision 5 or 6" }
        lang: { type: string, enum: [sr-Latn, sr-Cyrl, en], default: sr-Latn }
        species_filter:
          type: array
          description: "Omit for all species."
          items: { $ref: "#/components/schemas/Species" }
